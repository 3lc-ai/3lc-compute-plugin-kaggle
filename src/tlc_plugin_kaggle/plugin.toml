# 3LC Compute plugin manifest — the single source of truth for this plugin's
# metadata on the 0.2.x host (read import-free from the installed package;
# checked before pyproject.toml). Keep [tool.tlc-compute] in pyproject.toml
# in sync as documentation of record.
# Id is competition-scoped on purpose (collision safety: a future generic
# multi-competition fork can take "kaggle"). Display name stays generic.
id = "kaggle-exdark"
name = "Kaggle Competition"
description = "End-to-end Kaggle competition workflow: import the dataset, train the fixed baseline (YOLOv11n, pinned COCO-pretrained init @ 640), predict and submit. The whole competition loop without leaving the Hub. Uses Ultralytics YOLO (AGPL-3.0); commercial use may require an Ultralytics Enterprise License."
version = "1.2.12"
min_service_version = "0.2.0"
icon = "🏁"
# Same flag as the fragment's header identity icon (16px grid, 1.5px stroke,
# currentColor) — two strokes only, stays crisp at 16px.
icon_svg = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14V2.5"/><path d="M3.5 3h8.5l-1.8 2.5L12 8H3.5"/></svg>'
repository_url = "https://github.com/3lc-ai/3lc-compute-plugin-kaggle"

[ui]
display_mode = "sidebar"
section = "AI Tools"
priority = 40
compatible_with = ["table"]
output_types = ["run"]

[runtime]
isolation = "venv"
entrypoint = "tlc_plugin_kaggle:KagglePlugin"
provision_extra = "kaggle"
# Training runs in the worker on the participant's GPU; the Import tab is
# CPU-only but the plugin as a whole is GPU-classified.
requires_gpu = true
training = true
