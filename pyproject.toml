[project]
name = "3lc-compute-plugin-kaggle"
version = "1.2.11"
description = "End-to-end Kaggle competition workflow for the 3LC Hub: import, train the fixed baseline, predict, submit."
# >=3.11: the kaggle client (>=2.2.3) floors at 3.11; uv sync resolves for the
# whole requires-python range, so a 3.10 floor makes the lock unsatisfiable.
requires-python = ">=3.11"
# AGPL-3.0: this plugin links 3lc-ultralytics (Ultralytics YOLO, AGPL-3.0),
# so a distributed work must itself be AGPL-3.0. Full text in ./LICENSE.
license = "AGPL-3.0-only"
# Base = the SDK floor ONLY (the yolo-0.1.3 umbrella pattern). The heavy stack
# rides the [kaggle] extra below and is installed only into the plugin's
# provisioned venv. SDK >=0.3 carries `3lc[pandas]` as a BASE dep (the old
# [shared] extra is empty/vestigial there — don't request it). The window
# mirrors the 0.3-contract hosts' own pin (3lc-compute >=0.6: `>=0.3.1,<0.4`);
# contract compatibility is compared on MAJOR.MINOR, and 3lc-compute >=0.6
# provisions from public PyPI ONLY (no CloudRepo defaults), where the SDK
# starts at 0.2.2 — a <0.2 pin is unresolvable there as a bare/index/wheel
# requirement. (uv DOES honor a git source's own [tool.uv] indexes, which is
# how v1.2.7 kept silently shipping SDK 0.1.1 from the retired prereleases
# index; modern hosts flag the contract mismatch pre-flight.)
dependencies = [
    "3lc-compute-plugin-sdk>=0.3.1,<0.4.0",
]

# The plugin's heavy stack — installed ONLY into the provisioned venv
# (uv sync --extra kaggle, or 3lc-compute-plugin-kaggle[kaggle]==<ver> from a
# catalog install). Named by runtime.provision_extra in plugin.toml.
[project.optional-dependencies]
kaggle = [
    "3lc-ultralytics>=0.3.3",
    "torch",
    "torchvision",
    # Settings exposes pacmap/umap embedding reducers; union with [shared]'s
    # 3lc[pandas] yields 3lc[pandas,pacmap,umap] in the venv (yolo pattern).
    "3lc[pacmap,umap]>=3.0.0,<4.0.0",
    # Kaggle API client for entered-check, submission upload, and status.
    "kaggle>=2.2.3,<3",
]

# Dev-only tooling (PEP 735). Never part of the wheel/sdist or the [kaggle]
# provision extra — the ui-notes no-new-dependencies rule governs RUNTIME
# deps; this group never ships and never enters a provisioned venv.
[dependency-groups]
dev = ["pytest>=8"]

# The test layer imports the plugin modules straight from src/ (they are
# stdlib-light at module level by design — heavy imports live in functions).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Advertised for the installed-package / catalog discovery path. Value = the
# import package; its bundled plugin.toml drives id/ui/runtime + the extra.
# Key MUST equal the plugin id (the host dedups discovery on ep.name).
[project.entry-points."tlc_compute.plugins"]
kaggle-exdark = "tlc_plugin_kaggle"

# ── Legacy-host manifest (tlc_compute 0.1.x reads class attrs, never this;
# the 0.2.x host reads src/tlc_plugin_kaggle/plugin.toml, which wins over
# this table. Kept in sync as documentation of record.) ─────────────────────
[tool.tlc-compute]
id = "kaggle-exdark"
name = "Kaggle Competition"
description = "End-to-end Kaggle competition workflow: import the dataset, train the fixed baseline (YOLOv11n, pinned COCO-pretrained init @ 640), predict and submit. The whole competition loop without leaving the Hub. Uses Ultralytics YOLO (AGPL-3.0); commercial use may require an Ultralytics Enterprise License."
version = "1.2.11"
min_service_version = "0.2.0"
icon = "🏁"
repository_url = "https://github.com/3lc-ai/3lc-compute-plugin-kaggle"

[tool.tlc-compute.ui]
display_mode = "sidebar"
section = "AI Tools"
priority = 40
compatible_with = ["table"]
output_types = ["run"]

[tool.tlc-compute.runtime]
isolation = "venv"
entrypoint = "tlc_plugin_kaggle:KagglePlugin"
provision_extra = "kaggle"
requires_gpu = true
training = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlc_plugin_kaggle"]

# The sdist is an ALLOWLIST, not an exclude list, and deliberately so: the
# default sweep shipped every internal doc plus an untracked
# .claude/settings.local.json carrying absolute dev paths, the redirected-home
# layout and service ports. An exclude list leaks each new untracked file by
# default; naming what ships cannot. pyproject.toml and PKG-INFO are always
# included by hatchling and need no entry.
# tests/ and scripts/ are a package deal: tests/test_kit_scripts.py puts
# scripts/ on sys.path and imports make_kit_manifest, so dropping scripts/
# breaks the shipped suite at import. It builds a synthetic kit in tmp_path,
# so kit/manifest.json is NOT needed. Docs, CLAUDE.md, CONTEXT.md,
# catalog.json, uv.lock and kit/ are all out - none is a build input.
[tool.hatch.build.targets.sdist]
include = [
  "/src/tlc_plugin_kaggle",
  "/tests",
  "/scripts",
  "/README.md",
  "/LICENSE",
]

# torch/torchvision from the CUDA 12.8 index on Linux AND Windows — used only
# when the [kaggle] extra is selected during folder-source venv provisioning
# (uv sync). Windows needs the explicit index because default-PyPI torch on
# Windows is CPU-only. macOS falls through to PyPI (no CUDA there).
# FORCED CHANGE vs the yolo-0.1.3 pattern it copies: cu128, not cu126 —
# Blackwell GPUs (sm_120, e.g. RTX 5070 Ti) are not supported by cu126 wheels;
# cu128 wheels run older architectures too. See docs/forced-changes-0.2.md.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# 3lc releases index. 3lc 3.2+ is back on public PyPI, so this is belt-and-
# suspenders for folder-source dev provisioning, not a requirement; the SDK
# itself resolves from PyPI (it left the CloudRepo mounts at 0.2.2 — the
# retired prereleases index tops out at SDK 0.2.1 and MUST NOT be pinned as
# an explicit source again: it would make the >=0.3.1 pin unresolvable).
[[tool.uv.index]]
name = "3lc-releases"
url = "https://pypi.3lc.ai/public/repositories/releases-public"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
"3lc" = { index = "3lc-releases" }
