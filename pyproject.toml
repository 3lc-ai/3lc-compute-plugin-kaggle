[project]
name = "3lc-compute-plugin-kaggle"
version = "1.1.1"
description = "End-to-end Kaggle competition workflow for the 3LC Hub: import, train the fixed baseline, predict, submit."
requires-python = ">=3.10"
# Installed host (tlc_compute 0.1.1.47) imports in-process: deps must already
# exist in the host venv. No SDK dependency yet — the installed host has no
# tlc_plugin_sdk; the ComputePlugin base comes from tlc_compute itself.
dependencies = []

# ── New-host manifest ──────────────────────────────────────────────────────
# The installed host (0.1.1.47) NEVER reads this table — its manifest is the
# class attributes on KagglePlugin in src/tlc_plugin_kaggle/__init__.py.
# This table is kept in sync by hand for the future catalog/venv host
# (see docs/deployment-guide.md appendix).
[tool.tlc-compute]
id = "kaggle"
name = "Kaggle Competition"
description = "End-to-end Kaggle competition workflow: import the dataset, train the fixed baseline (YOLOv11n, pinned COCO-pretrained init @ 640), predict and submit."
version = "1.1.1"
min_service_version = "0.1.0"
icon = "🏁"
repository_url = "https://github.com/3lc-ai/3lc-compute-plugin-kaggle"

[tool.tlc-compute.ui]
display_mode = "sidebar"
section = "AI Tools"
priority = 40
compatible_with = ["table"]
output_types = ["run"]

[tool.tlc-compute.runtime]
isolation = "venv"
entrypoint = "tlc_plugin_kaggle:KagglePlugin"
provision_extra = "kaggle"
requires_gpu = true
training = true

[project.entry-points."tlc_compute.plugins"]
kaggle = "tlc_plugin_kaggle"
